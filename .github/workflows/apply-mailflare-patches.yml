
name: Apply Mailflare patches

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to apply patches to
        required: true
        default: beta
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Download and apply patch
        run: |
          set -euo pipefail

          curl -fsSL \
            https://raw.githubusercontent.com/XSR1/mailflare/refs/heads/main/.github/mailflare-patches.patch \
            -o mailflare-patches.patch

          git apply --check mailflare-patches.patch
          git apply mailflare-patches.patch

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: apply-mailflare-patches-${{ inputs.target_branch }}
          base: ${{ inputs.target_branch }}
          title: Apply Mailflare patches
          body: Apply the selected commits.
          commit-message: Apply Mailflare patches
          delete-branch: true
