
name: Unlock all features

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to apply patches to
        required: true
        default: main
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Download and apply patch
        run: |
          set -euo pipefail
          
          # https://github.com/XSR1/mailflare/commit/1650a6c07faaf213bf3f45dffe550610d8862ebb
          curl -fsSL \
            https://github.com/XSR1/mailflare/commit/1650a6c07faaf213bf3f45dffe550610d8862ebb.patch \
            -o mailflare-patches.patch

          git apply mailflare-patches.patch

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: apply-mailflare-patches-${{ inputs.target_branch }}
          base: ${{ inputs.target_branch }}
          title: Unlock all features
          body: Apply the selected commits.
          commit-message: Apply Mailflare patches
          delete-branch: true
