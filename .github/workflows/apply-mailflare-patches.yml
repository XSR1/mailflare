
name: Apply Mailflare patches

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and apply patch
        run: |

          curl -fsSL \
            https://raw.githubusercontent.com/XSR1/mailflare/refs/heads/main/.github/mailflare-patches.patch \
            -o mailflare-patches.patch

          git apply mailflare-patches.patch

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: apply-mailflare-patches
          base: main
          title: Apply Mailflare patches
          body: |
            Apply the selected Mailflare patches.
          commit-message: Apply Mailflare patches
          delete-branch: true
