
name: Apply Mailflare patches

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and apply patch
        run: |
          set -euo pipefail

          curl -fsSL \
            https://github.com/XSR1/mailflare/commit/a27ff6f23dacb66aa0556f3a6c3933699fc51523.patch \
            -o mailflare-patches.patch

          git fetch --no-tags https://github.com/XSR1/mailflare.git main

          git apply --3way --index mailflare-patches.patch

          rm mailflare-patches.patch

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: apply-mailflare-patches
          base: main
          title: Apply Mailflare patches
          body: |
            Apply the selected Mailflare patches.
          commit-message: Apply Mailflare patches

