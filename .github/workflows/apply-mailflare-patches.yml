
name: Apply selected Mailflare patches

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout unlock
        uses: actions/checkout@v4
        with:
          ref: unlock
          fetch-depth: 0

      - name: Download and apply first patch
        run: |
          curl -fsSL \
            https://github.com/kelvenhighermind/mailflare/commit/f161510e08c00a1cf40a5ac1d59ddfb9ddd671bf.patch \
            -o first.patch

          # Exclude wrangler.jsonc changes
          git apply --exclude=wrangler.jsonc first.patch

      - name: Download and apply second patch
        run: |
          curl -fsSL \
            https://github.com/kelvenhighermind/mailflare/commit/fcc6e0c493c85198f36fd471e0d07bee65578f99.patch \
            -o second.patch

          git apply second.patch

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: apply-selected-mailflare-patches
          base: unlock
          title: Apply selected Mailflare patches
          body: Apply the two selected commits, excluding wrangler.jsonc.
          commit-message: Apply selected Mailflare patches

